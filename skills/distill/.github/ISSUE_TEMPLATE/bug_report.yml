name: Bug Report
description: Something isn't working correctly in the wizard or output
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the details below.

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g., macOS 14, Windows 11, Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: claude-version
    attributes:
      label: Claude Code Version
      placeholder: "e.g., 1.x.x (run `claude --version`)"
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: Which wizard phase failed?
      options:
        - Phase 1 — Surface
        - Phase 2 — Refine
        - Phase 3 — Package
        - Phase 4 — Verify
        - Not in a specific phase
    validations:
      required: true

  - type: dropdown
    id: output-type
    attributes:
      label: Target output type
      options:
        - Skill
        - Specialist
        - SOP
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe what went wrong
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run /distill
        2. Selected pattern X
        3. ...
    validations:
      required: true
